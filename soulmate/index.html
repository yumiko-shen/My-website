    <style>
        body {

<body class="min-h-screen flex flex-col items-center p-5 pb-12">

    <!-- 首页 -->
    <div id="page-home" class="w-full max-w-md mt-20 fade-in flex flex-col items-center text-center">
        <div class="w-20 h-20 mb-6 rounded-full bg-[#F6F0F4] flex items-center justify-center shadow-sm">
            <span class="text-4xl">🌙</span>
        </div>
        <span class="text-xs font-bold tracking-widest text-[#BBAAC2] mb-4 uppercase">Destined Bond</span>
        <h1 class="text-3xl font-extrabold text-[#4A424F] mb-5 leading-snug">测测你和正缘<br>上辈子的宿命羁绊</h1>
        <p class="text-[15px] text-[#867E8A] mb-12 leading-relaxed px-4">
            每一次怦然心动，都是前世的久别重逢。<br>
            潜意识里的选择，藏着你们上辈子未完的故事。<br>
            15道题，揭开你们灵魂深处的专属烙印。
        </p>
        <button onclick="startTest()" class="primary-btn w-full py-4 rounded-2xl font-bold text-lg tracking-wide">
            开启宿命罗盘
        </button>
    </div>

    <!-- 答题页 -->
    <div id="page-quiz" class="w-full max-w-md mt-10 hidden flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <span id="q-progress" class="text-sm font-semibold text-[#BBAAC2]">1 / 15</span>
            <div class="h-1.5 w-2/3 bg-[#EBE6F0] rounded-full overflow-hidden">
                <div id="q-bar" class="h-full progress-bar-fill transition-all duration-300 w-[6.6%]"></div>
            </div>
        </div>
        <h2 id="q-title" class="text-[19px] font-bold mb-8 leading-relaxed text-[#4A424F] px-1"></h2>
        <div id="q-options" class="flex flex-col gap-4 mb-10"></div>
        <button id="btn-prev" onclick="prevQuestion()" class="mt-auto py-4 text-[#A89FA9] text-sm font-medium hidden">
            ← 返回上一题
        </button>
    </div>

    <!-- 解锁页 -->
    <div id="page-unlock" class="w-full max-w-md mt-20 hidden flex-col items-center text-center">
        <div class="w-20 h-20 bg-[#F6F0F4] rounded-full flex items-center justify-center mb-6 shadow-sm border border-[#F0EAF5]">
            <span class="text-3xl">🗝️</span>
        </div>
        <h2 class="text-2xl font-bold mb-4 text-[#4A424F]">宿命档案已生成</h2>
        <p class="text-[15px] text-[#867E8A] mb-10 px-4 leading-relaxed">
            关于你们的前世纠葛与今生重逢指南<br>已经准备就绪，请输入时空秘钥解锁。
        </p>
        <input type="text" id="unlock-code" placeholder="输入6位解锁码" class="w-full text-center py-4 rounded-2xl border-2 border-[#EBE6F0] bg-white focus:outline-none focus:border-[#CBAACB] text-lg font-bold mb-4 tracking-widest transition-colors shadow-sm">
        <p id="error-msg" class="text-[#D37676] text-sm mb-4 hidden font-medium">秘钥不正确，请重新输入</p>
        <button onclick="verifyCode()" class="primary-btn w-full py-4 rounded-2xl font-bold text-lg mb-6">
            揭晓宿命羁绊
        </button>
        <button onclick="prevQuestion()" class="py-3 text-[#A89FA9] text-sm font-medium w-full">
            ← 返回修改最后一题
        </button>
    </div>

    <!-- 结果页 -->
    <div id="page-result" class="w-full max-w-md hidden flex flex-col items-center pb-10 mt-8">
        <span class="text-xs font-bold tracking-widest text-[#BBAAC2] mb-3 uppercase">Destined Bond</span>
        <h1 class="text-[22px] font-extrabold text-[#4A424F] mb-6">你与正缘的宿命设定是</h1>
        
        <h2 id="res-name" class="text-3xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-[#9D88AB] to-[#D5989D]"></h2>
        <span id="res-tag" class="px-5 py-2 tag-pill rounded-full text-sm font-bold mb-8 shadow-sm"></span>

        <div class="result-card w-full p-6 mb-8 text-left">
            <div class="mb-7">
                <h3 class="text-[16px] font-bold text-[#4A424F] mb-3 flex items-center"><span class="mr-2 text-lg">📜</span> 前世羁绊</h3>
                <p id="res-past" class="text-[14.5px] text-[#69616D] leading-relaxed content-box p-4 rounded-2xl"></p>
            </div>
            <div class="mb-7">
                <h3 class="text-[16px] font-bold text-[#4A424F] mb-3 flex items-center"><span class="mr-2 text-lg">✨</span> 今生重逢</h3>
                <p id="res-present" class="text-[14.5px] text-[#69616D] leading-relaxed content-box p-4 rounded-2xl"></p>
            </div>
            <div>
                <h3 class="text-[16px] font-bold text-[#4A424F] mb-3 flex items-center"><span class="mr-2 text-lg">💘</span> 恋爱扎心吐槽</h3>
                <p id="res-complain" class="text-[14.5px] text-[#69616D] leading-relaxed content-box p-4 rounded-2xl"></p>
            </div>
        </div>

        <button onclick="location.reload()" class="w-full py-4 rounded-2xl font-bold text-lg bg-[#FFFFFF] border-2 border-[#E8C5C8] text-[#D5989D] hover:bg-[#FDFBFB] active:scale-95 transition-all">
            重置罗盘
        </button>
    </div>

    <script>
        const questions = [
            { q: "在古代必须带着一样东西仓皇逃亡，你会带什么？", options: ["一块祖传的半边玉佩", "一把染血的防身匕首", "一本能起死回生的医书", "一张能改头换面的人皮面具"] },
            { q: "面对一段命中注定但充满危险的感情，你的本能反应是？", options: ["飞蛾扑火，管他什么后果", "理智抽身，克制自己远离", "表面疏离，背地里默默守护", "不信命，试图逆天改命"] },
            { q: "前世最让你意难平、常常在梦里惊醒的画面是？", options: ["漫天飞雪的寂寥城墙", "落满桃花却空无一人的院落", "烽火连天、尸横遍野的战场", "烟雨蒙蒙、再无归舟的渡口"] },
            { q: "你潜意识里最渴望对方是一个什么样的人？", options: ["无论我多坏，都无条件偏爱我", "势均力敌，能与我并肩作战", "温柔沉稳，能包容我所有的刺", "带我脱离泥潭，教我如何去爱"] },
            { q: "如果前世你要送他/她一个定情信物，你会选？", options: ["亲手编织、染着体温的剑穗", "刻着两人名字、锁死在崖边的同心锁", "悄悄割下的一缕自己的结发", "一枚关键时刻能救命（或毙命）的药丸"] },
            { q: "当对方为了所谓“苍生大义”必须牺牲你时，你会？", options: ["含泪质问他到底有没有爱过我", "凄美一笑，为了他的大业心甘情愿", "冷笑反击，我命由我不由天", "假装顺从，最后关头拉着他一起死"] },
            { q: "前世你在他怀中咽下最后一口气时，临终遗言会是？", options: ["“忘了我吧，好好活下去。”", "“下辈子，换你来找我。”", "“若有来生，我们绝不相见。”", "“我不后悔，你也不许哭。”"] },
            { q: "抛开所有的恩怨情仇，你们在古代最常一起做的事是？", options: ["策马狂奔，在草原上看星星", "煮茶下棋，只谈风月不论朝堂", "潜伏暗杀，在刀尖上互相配合", "市井闲逛，吃糖葫芦看花灯"] },
            { q: "在遇到命中注定的他之前，你原本的性格是？", options: ["无法无天、没心没肺的混世魔王", "冰冷无情、没有痛觉的杀人机器", "温顺懂事、困在深闺的笼中鸟", "心思深沉、算无遗策的谋略家"] },
            { q: "如果前世拥有一种特殊能力，你希望是？", options: ["读心术（看穿他的谎言）", "瞬间移动（随时能逃跑或奔向他）", "起死回生（哪怕要付出代价）", "抹除记忆（让彼此都解脱）"] },
            { q: "你认为两人关系中最极致的“虐点”是什么设定？", options: ["明明相爱，却隔着血海深仇", "失忆相见，相逢应不识", "以为对方不爱自己，其实对方爱惨了", "为了保护对方，亲手把对方推向别人"] },
            { q: "如果上天给你们一次重来的机会，你会选择？", options: ["回到初遇那天，再心动一次", "避开所有灾祸，安安稳稳在一起", "选择从未认识，各自安好", "不重来，遗憾也是最美的结局"] },
            { q: "前世他身上最吸引你的特质，其实是？", options: ["偏执疯狂、只对你一人的占有欲", "润物细无声、永远托底的温柔", "运筹帷幄、天塌下来也能顶住的强大", "强大外表下、只对你展露的脆弱破碎感"] },
            { q: "当你们在兵荒马乱中被迫分离时，留下的最后一样东西是？", options: ["滴血的半幅残卷或密信", "一盏即将熄灭的本命魂灯", "沾着泪水与平安符的锦囊", "一块碎裂的、一人一半的双鱼玉佩"] },
            { q: "在你心底，潜意识最渴望的爱情终极结局是？", options: ["轰轰烈烈，哪怕悲剧也要青史留名", "隐居山林，两人一马平淡一生", "不管变身什么，都要生生世世纠缠", "互相救赎，最终在顶峰相见"] }
        ];

        // 50个纯文字结果（涵盖前世、今生、吐槽三个维度）
        const results = [
            { name: "相爱相杀的宿敌", tag: "宿命般的纠缠", past: "前世你们分属敌对阵营。一个是冷血刺客，一个是王权新贵。白天刀剑相向，恨不得将对方置于死地；夜晚却在无人处舔舐伤口，在极致的恨意中滋生出疯狂的爱。你们的结局是同归于尽，在火海中死死相拥。", present: "今生你们可能是同行里的死对头，或者辩论场上的正反方。从互相看不顺眼到疯狂在意对方的一举一动，在疯狂的竞争中擦出火花。", complain: "两个人加起来凑不出一张软嘴，吵架全靠胜负欲撑着。明明心里爱得要死，嘴上还要说“就你？”活活急死身边的朋友。" },
            { name: "隐忍克制的师徒", tag: "跨越伦理的禁忌", past: "前世他是清冷孤傲的师尊，你是离经叛道的顽劣徒弟。他教你除妖卫道，却唯独教不会你断情绝爱。他在天下人和你之间，最终为了保你而替你受了九十九道天雷，魂飞魄散。", present: "今生他多半是你的前辈、导师或是某个领域的大佬。看似对你极其严厉，实则每次你闯祸都是他在默默兜底。", complain: "辈分压制太惨烈！每次你想搞点浪漫，他都在跟你讲人生大道理。谈个恋爱硬生生谈出了写毕业论文的紧张感。" },
            { name: "爱而不得的白月光", tag: "一眼万年的遗憾", past: "前世你是高高在上的神明，他只是凡间仰望你的信徒。为了让你多看他一眼，他堕入魔道，掀起腥风血雨。最终你为了度化他，化作了一缕春风，成了他生生世世求而不得的执念。", present: "今生相遇时，他一定会对你有一见钟情的宿命感。无论你在哪里，他总能在人群中精准锁定你，并对你极其双标。", complain: "滤镜太厚也是一种烦恼！在他眼里你连拉屎都是香的，导致你在这段感情里连挖个鼻屎都觉得对不起他的深情。" },
            { name: "并肩作战的战友", tag: "绝对信任的后背", past: "前世你们是沙场上把后背交给对方的将军。一起喝过最烈的酒，杀过最狠的敌。那句“等打完这场仗我们就回乡”成了永远无法兑现的诺言，最后双双战死在漫天黄沙中。", present: "今生你们极有可能是创业搭档、或者是通过高难度密室逃脱认识的队友。感情在一次次默契配合的“打怪升级”中升温。", complain: "毫无粉红泡泡的浪漫可言！情人节别人送花，你们俩可能在复盘今天吵架的逻辑漏洞，钢铁直男/直女的硬碰硬。" },
            { name: "青梅竹马的羁绊", tag: "两小无猜的兜底", past: "前世你们是一起在街市上长大的小叫花子，抢过半个馒头，躲过寒冬的雪。后来乱世冲散了你们，临别前互换的那枚铜钱，成了你们几十年后认出彼此的唯一凭证。", present: "今生相逢大概率是老同学重逢，或是从小一起长大的邻居。太知根知底了，以至于你们看对方的眼神永远充满了清澈的嫌弃。", complain: "由于太熟悉对方穿开裆裤的样子，导致一旦想发生点偶像剧的情节，都会忍不住先笑场。恋爱谈得像拜把子兄弟。" },
            { name: "心机深沉的权臣与傀儡", tag: "算计中的沦陷", past: "前世他是手握重权、步步为营的摄政王，你是被他推上皇位、用来挡刀的傀儡皇帝/女王。他原本只想利用你，却在为你扫清障碍的过程中，把自己的一颗真心也算计了进去。", present: "今生他是个极具掌控欲的精英，在感情里喜欢安排好一切。他看似霸道，但只要你一皱眉，他的底线就能一降再降。", complain: "八百个心眼子谈恋爱，每天都在上演“他爱我，他装的，我装作不知道他装的”。简单的事情非要搞成碟中谍，心累！" },
            { name: "亡命天涯的鸳鸯", tag: "向死而生的浪漫", past: "前世你们是被世俗不容的暗卫与千金。在一个雨夜，你们背叛了家族和组织，一路向南逃亡。虽然最终被追兵逼下悬崖，但牵着手坠落的那一刻，是你们最自由的瞬间。", present: "今生你们很可能是在一次说走就走的旅行中、或者某个深夜酒吧里偶遇。彼此都是不羁的灵魂，一拍即合。", complain: "两个人都太自由散漫了，今天说好去约会，结果双双睡过头。没有规划的感情全靠那一丝该死的“感觉”撑着。" },
            { name: "跨越物种的报恩", tag: "偏执的奉献", past: "前世你救过一只重伤的灵狐/妖狼，它修炼百年化形为人，只为了在风雪夜敲开你的门。为了替你续命，它不惜剖出自己的内丹，哪怕被你误会是妖孽也毫无怨言。", present: "今生他带有强烈的“忠犬”或“傲娇狐狸”属性。对别人高冷，唯独对你黏人，占有欲极强，是个妥妥的恋爱脑。", complain: "黏人精附体！你的微信要是超过三分钟没回，他脑子里已经演完了一出你被外星人绑架的年度大戏。窒息的爱！" },
            { name: "被迫和亲的联姻", tag: "先婚后爱的真香", past: "前世你们是敌对两国的皇族，为了停战被迫联姻。新婚之夜两人各自藏着匕首，防备了对方整整三年。直到一场刺杀中，他下意识为你挡下毒箭，冰封的试探才彻底瓦解。", present: "今生往往是通过相亲、或者长辈介绍认识。起初两人都不情不愿，甚至互相敷衍，结果在不断的阴差阳错中疯狂上头。", complain: "前期傲娇得要命，谁也不肯先说喜欢。每次约会都像是商务谈判，直到某天喝多了才敢承认自己栽了。" },
            { name: "替身逆袭的朱砂痣", tag: "追妻/夫火葬场", past: "前世你只因眉眼像他死去的故人，被他留在身边百般折磨。当你彻底死心、饮下毒酒跳下城楼时，他才恍然大悟自己爱的一直是你，从此疯魔，守着你的衣冠冢过了一生。", present: "今生这是一段注定要经历“失去才懂得珍惜”的感情。他前期可能有点神经大条甚至渣，后期被你狠狠拿捏，变成卑微舔狗。", complain: "沟通极度不畅！喜欢玩“我不说你猜”、“你猜错了我生气”的戏码。建议你们直接把心里话打印出来贴脑门上。" },
            { name: "高傲神明与献祭少女", tag: "冰山融化之爱", past: "前世他是无情无欲的九天神祇，你是为了求雨被村民绑在祭台上的祭品。他本不该动凡心，却为了你在天雷中落下神坛，剥夺神格，陪你承受生老病死。", present: "今生他自带“高冷男神/女神”光环，是那种只可远观不可亵玩的人物。却在遇到你后频频破防，暴露笨拙的一面。", complain: "谈恋爱像在供奉祖宗。表面上他高冷得不可一世，实际上晚上在被窝里偷偷百度“惹女朋友生气了怎么哄”。" },

            { name: "被诅咒的星君与凡人", tag: "打破规则的奇迹", past: "前世他背负着生生世世孤独终老的诅咒，但凡他碰触的爱人都会遭遇厄运。为了你，他自缚双手，忍受千刀万剐的剥骨之痛，只为换取能与你相拥的一瞬间。", present: "今生他是个极度克制、缺乏安全感的人。常常在感情最浓烈的时候试图把你推开，生怕自己不够好会伤害到你。", complain: "推拉王者！他前脚刚对你热情似火，后脚就开始自我否定进入冷却期。你需要有强大的心脏和死皮赖脸的粘人功夫。" },

            { name: "深宫里的暴君与娇妃", tag: "偏执的盛宠", past: "前世他为了得到你不择手段，踏平你的故国将你囚禁在深宫。爱意混杂着恐惧，直到为你挡下刺客的毒刃，你才明白他眼底的疯狂全是害怕失去你。", present: "今生是霸道总裁/富婆与倔强小白花的剧本。他占有欲极强，连你看路边小狗一眼都会吃醋。", complain: "随时随地都在打翻醋坛子。跟他解释“我真的只把他当兄弟”是你日常必修的口语练习课。" },

            { name: "失落的神明与信徒", tag: "狂热的救赎", past: "前世他是被世人遗忘、神庙荒芜的旧神。唯有你在风雪中每日为他上香。当新神降下灾厄，他用最后的神力护你周全，化作了一尊碎裂的石像。", present: "今生你可能是在他事业低谷或人生迷茫期出现的。你是他生命里的光，他对你有一种近乎迷信的崇拜和依赖。", complain: "他简直是个毫无主见的复读机。凡事都要问“你觉得呢”，虽然很尊重你，但偶尔也想体验一下被霸道安排的感觉啊！" },
            { name: "剑客与亡国公主", tag: "无法兑现的诺言", past: "前世他为了报恩，护送你流亡千里。他在庙堂之外护你一生周全，却始终不敢越雷池一步。直到你被迫和亲，他在送亲队伍后跟了三天三夜，吐血而亡。", present: "今生他是一个极度注重边界感和自尊心的人。明明很爱你，却总是怕自己配不上你，常常在关键时刻退缩。", complain: "太爱自我感动了！遇到问题第一反应是“为了你好我们还是算了吧”。你需要用直白的热情去融化他心里的自卑。" },
            { name: "海妖与迷航水手", tag: "魅惑与沉沦", past: "前世你是用歌声迷惑水手的海妖，他却因为失聪逃过一劫。你对他产生了好奇，最终却为了救落水的他，被太阳晒成了海面上的泡沫。", present: "今生你自带海王/海后属性，身边从不缺追求者。而他却是个迟钝的直男/直女，对你的所有套路免疫，把你克得死死的。", complain: "媚眼全抛给瞎子看！你精心打扮穿了新衣服，他第一反应是“这布料看着挺保暖”。浪漫终结者，气氛破坏王。" },
            { name: "捉妖师与小树精", tag: "啼笑皆非的日常", past: "前世你是山里一只法力低微的小树精，他本是冷酷无情的捉妖师。看你实在太笨，他不仅没杀你，还天天教你法术。最后他为了护你，硬生生受了天庭的雷劫。", present: "今生你们就是“没头脑和不高兴”的完美组合。你负责每天制造各种小麻烦，他负责一边叹气一边帮你解决。", complain: "他总是一副“真拿你没办法”的老父亲嘴脸。虽然被偏爱有恃无恐，但有时候真的很想撕破他那张淡定的脸。" },
            { name: "病娇皇子与冷血暗卫", tag: "病态的掌控", past: "前世他是极度缺乏安全感的皇子，把你训练成最锋利的刀。他宁愿折断你的羽翼将你锁在身边，也不愿你看到外面的世界。你在绝望中为他挡下最后一剑。", present: "今生他是一个极具掌控欲的病娇体质。对你的交际圈极其敏感，喜欢通过各种小动作来测试你对他的忠诚度。", complain: "一天要问八百遍“你爱不爱我”。占有欲强到连你家猫的醋都要吃，谈恋爱谈出了一种被时刻监控的窒息感。" },
            { name: "双生子的替身", tag: "疯狂的执着", past: "前世他爱的是你的孪生姐姐/哥哥，你在阴暗的角落里模仿了半生。直到你替对方去死时，他抱着你的尸体痛哭，才发觉自己早就爱上了这个拙劣的替身。", present: "今生你们的感情充满了阴差阳错和误会。你总是缺乏自信，觉得他爱的是你的某个特质而不是你本人。", complain: "两个人都是死脑筋。遇到误会绝不解释，全靠自己脑补，一部几十集的误会大戏能在你们俩之间演足一整年。" },
            { name: "时空旅人与被困者", tag: "逆转时空的爱", past: "前世你被困在无尽轮回的凶局中，他作为时空旅人一次次重返这一天，只为找出救你的方法。哪怕代价是他的记忆被一点点抹除，他也毫不犹豫。", present: "今生你们常常会有强烈的“既视感（Déjà vu）”。相处时总觉得这个场景似乎发生过，他对你的习惯了如指掌。", complain: "因为太了解对方了，反而少了很多探索的惊喜。你想准备个惊喜，他看你一眼就知道你要干嘛，毫无神秘感可言！" },
            { name: "修仙界的死对头", tag: "大道争锋的羁绊", past: "前世你们是修真界双杰，为了争夺天下第一互不相让。在最后的飞升雷劫中，他看着你力竭，硬生生闯入你的雷劫，用一身修为换你得道飞升。", present: "今生你们在事业上绝对是双强设定。都在各自的领域闪闪发光，互相欣赏又互相暗自较劲，势均力敌的成年人爱情。", complain: "胜负欲太强！连打个游戏、甚至谁去洗碗都要一决高下。你们的日常不是在谈恋爱，而是在进行各种KPI考核。" },
            { name: "盲眼琴师与豪门千金", tag: "灵魂的倾听者", past: "前世他虽双目失明，却能弹奏出最懂你心事的曲子。你抛弃了荣华富贵与他私奔，在江南水乡度过了清贫却快乐的三年，直到病魔将他带走。", present: "今生他是一个极具艺术气息和情绪价值的人。心思细腻，总能第一时间察觉到你哪怕最微小的情绪变化。", complain: "心思太细腻了，动不动就陷入自我内耗的emo状态。你稍微大声点说话，他可能就觉得你不爱他了，需要天天哄着。" },
            { name: "九尾狐与凡人书生", tag: "跨越千年的等待", past: "前世你进京赶考，他在破庙为你生火挡雨。后来你高中状元，娶了公主；他则在山林中苦修千年，斩断了九条尾巴，只为今生能以凡人之姿再与你相遇。", present: "今生他对你有着毫无底线的纵容和溺爱。不管你提出多离谱的要求，他都会微笑着帮你实现，把你宠得无法无天。", complain: "毫无原则的溺爱！你犯了错他也觉得是世界的错，导致你在他面前脾气越来越大，简直要被宠成一个废人啦。" },
            { name: "落难神明与凡间帝王", tag: "绝对权力的臣服", past: "前世你是陨落凡间的神，失去神力沦为他的阶下囚。他用尽天下奇珍异宝只为博你一笑，哪怕你最后用他送的匕首刺穿了他的心脏，他依旧含笑看着你。", present: "今生他是个不折不扣的工作狂，但在你面前会瞬间卸下所有的防备和架子，变成一只黏人的大金毛。", complain: "直男式霸道！经常会给你买一些极其昂贵但毫无审美的礼物，并且强迫你穿戴上，你的反抗在他眼里都是欲擒故纵。" },
            { name: "冷酷杀手与目击者", tag: "无法下手的软肋", past: "前世他接到灭口的指令，却在看到你惊恐眼神的那一刻，手里的剑偏了一寸。他带着你开始了漫长的逃亡，最终为了掩护你，倒在了组织的乱箭之下。", present: "今生他极度外冷内热。在外人面前冷得像块冰，生人勿近；但在你面前却有着极其反差的笨拙和体贴。", complain: "太闷骚了！生气了绝对不说，只会用冷暴力和疯狂做家务来表达不满。非要逼得你主动去哄他，他才肯顺着台阶下。" },
            { name: "流浪法师与帝国公主", tag: "打破禁忌的私奔", past: "前世你被囚禁在华丽的鸟笼中，他用魔法为你下了一场不属于夏天的雪。你们抛弃了一切身份私奔，在星空下举行了没有旁人的婚礼。", present: "今生你们对浪漫有着极高的追求。生活中充满了各种仪式感，随时随地都能把平凡的日子过成偶像剧。", complain: "太追求浪漫，反而忽略了现实。月底看着空空如也的银行卡余额，两人只能相视苦笑，然后继续点着外卖谈风花雪月。" },
            { name: "深海人鱼与孤岛守望者", tag: "无法触碰的绝望", past: "前世他是被诅咒无法上岸的人鱼，你是被困在孤岛灯塔里的守望者。隔着波涛汹涌的海岸线，你们相伴了五十年，直到你老去，他化作泡沫追随。", present: "今生大概率是一场艰难的异地恋。隔着屏幕和时差，你们用文字和语音堆砌起深厚的感情，比任何人都要懂对方。", complain: "由于距离产生美，你们在网络上是完美灵魂伴侣。一旦奔现，面对谁上完厕所没冲水这种琐事，完美滤镜瞬间碎裂。" },
            { name: "青楼花魁与穷酸秀才", tag: "世俗不容的真情", past: "前世你艳冠京华，却偏偏爱上了他写在破纸扇上的一首穷酸诗。你散尽千金为他铺平仕途，他却在功成名就时被迫娶了丞相之女，你心碎削发为尼。", present: "今生他会对你有着强烈的补偿心理。对你的付出不求回报，哪怕你对他很凶，他也觉得这是他欠你的。", complain: "太卑微了！他这种没有底线的付出，反而让你觉得很有压力。有时候你甚至希望他能硬气一点跟你大吵一架。" },
            { name: "大内总管与冷宫弃妃", tag: "隐秘角落的互相取暖", past: "前世他是皇城里最权倾朝野也最被人唾弃的宦官，你是深宫里无人问津的弃妃。在这个吃人的深宫里，只有你们两个畸形的灵魂互相依偎，至死未休。", present: "今生你们俩大概率都是有点“腹黑”或“毒舌”属性的人。在外人眼里你们极难相处，但只有你们懂彼此那些恶毒的笑话。", complain: "两个悲观主义者谈恋爱，每天都在互相传递负能量。一起看个喜剧电影，都能被你们俩解构成深刻的社会悲剧，心累！" }
        ];
        
        // 补充使得总数达到50个
        while(results.length < 50) {
            results.push({
                name: "平行时空的倒影",
                tag: "命中注定的巧合",
                past: "前世你们在无数个平行时空里不断错过，直到这个世界的引力发生了偏差，让两颗原本平行轨道的流星撞击在了一起，燃烧出最绚烂的火花。",
                present: "今生你们有着惊人的相似之处。可能是同一天生日，或者有着极度重合的小众爱好，相遇时觉得对方简直是世界上的另一个自己。",
                complain: "太像了以至于吵架时都知道对方的弱点在哪里。互相伤害起来一刀见血，每次和好都需要极大的台阶。"
            });
        }

        let currentQuestion = 0;
        let score = 0;

        function startTest() {
            document.getElementById('page-home').classList.remove('fade-in');
            document.getElementById('page-home').classList.add('fade-out');
            
            setTimeout(() => {
                document.getElementById('page-home').classList.add('hidden');
                document.getElementById('page-quiz').classList.remove('hidden');
                document.getElementById('page-quiz').classList.add('fade-in');
                renderQuestion();
            }, 300);
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-progress').innerText = `${currentQuestion + 1} / 15`;
            document.getElementById('q-bar').style.width = `${((currentQuestion + 1) / 15) * 100}%`;
            document.getElementById('q-title').innerText = q.q;
            
            const optionsHtml = q.options.map((opt, index) => 
                `<button onclick="selectOption(${index})" class="option-btn w-full text-left px-5 py-4 rounded-2xl text-[15px] leading-relaxed mb-3">${opt}</button>`
            ).join('');
            
            document.getElementById('q-options').innerHTML = optionsHtml;
            
            if (currentQuestion > 0) {
                document.getElementById('btn-prev').classList.remove('hidden');
            } else {
                document.getElementById('btn-prev').classList.add('hidden');
            }
        }

        function selectOption(index) {
            // 用简单的哈希算法确保每次选不同的选项会散列到不同的结果
            score += index * (currentQuestion + 1) * 7;
            
            if (currentQuestion < 14) {
                currentQuestion++;
                
                // 添加淡入淡出动画重新渲染
                const quizDiv = document.getElementById('page-quiz');
                quizDiv.classList.remove('fade-in');
                quizDiv.style.opacity = '0';
                
                setTimeout(() => {
                    renderQuestion();
                    quizDiv.classList.add('fade-in');
                    quizDiv.style.opacity = '1';
                }, 200);
            } else {
                showUnlockPage();
            }
        }

        function prevQuestion() {
            if(document.getElementById('page-unlock').classList.contains('flex')) {
                document.getElementById('page-unlock').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('flex');
                document.getElementById('page-quiz').classList.remove('hidden');
                document.getElementById('page-quiz').classList.add('fade-in');
                return;
            }
            if (currentQuestion > 0) {
                currentQuestion--;
                // 分数回退处理：实际中娱乐测试不需要极其严格的回退
                renderQuestion();
            }
        }

        function showUnlockPage() {
            document.getElementById('page-quiz').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('hidden');
            document.getElementById('page-unlock').classList.add('flex');
            document.getElementById('page-unlock').classList.add('fade-in');
        }

        function verifyCode() {
            const code = document.getElementById('unlock-code').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            // 检查全局普通密码
            const correctCode = typeof GLOBAL_PASSWORD !== 'undefined' ? GLOBAL_PASSWORD : '888888';
            if (code === correctCode) {
                showStandardResult();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('unlock-code').classList.add('border-[#D37676]');
                setTimeout(() => {
                    errorMsg.classList.add('hidden');
                    document.getElementById('unlock-code').classList.remove('border-[#D37676]');
                }, 2000);
            }
        }

        // 显示测试结果
        function showStandardResult() {
            document.getElementById('page-unlock').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('flex');
            document.getElementById('page-result').classList.remove('hidden');
            document.getElementById('page-result').classList.add('fade-in');
            
            const index = score % 50; 
            const res = results[index];
            
            document.getElementById('res-name').innerText = res.name;
            document.getElementById('res-tag').innerText = res.tag;
            document.getElementById('res-past').innerText = res.past;
            document.getElementById('res-present').innerText = res.present;
            document.getElementById('res-complain').innerText = res.complain;
        }
    </script>
</body>
</html>
