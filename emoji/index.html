            ["疯批小兔", "images/tuzi.png", "rabbit,drama,hyper", "不可预测的混沌邪恶", "你的大脑结构绝对异于常人，经常会有极其跳脱的脑洞和让人摸不着头脑的操作。你精力旺盛，喜欢挑战一切不确定的事物，是朋友眼中的“开心果”兼“不定时炸弹”。", "思维太跳跃，有时候别人很难跟上你的节奏。偶尔也需要安静下来做个乖乖兔哦。"],
            ["优雅端水大师", "images/jisaier.png", "elegant,jisaier", "八面玲珑的社交花", "情商极高，极度在意别人的看法，总是能在不同的人群中游刃有余地穿梭。你永远不会让任何一个人冷场，是朋友圈里的中央空调和粘合剂。表面光鲜，其实内心很累。", "端水端久了，手也是会酸的。学会拒绝，试着把那一碗水泼出去，你会发现快乐很多。"],
            ["岁月静好", "images/hellokitty.png", "zen,hellokitty", "强撑微笑的假笑男孩/女孩", "即使生活已经把你按在地上摩擦，你发出的表情包依然是“好的呢~”、“开心~”。你极力向世界展示你美好的一面，把所有的崩溃都留给深夜的自己，让人心疼的体面人。", "别再装坚强了，偶尔发一次脾气、爆一句粗口，你会发现天塌不下来。"]
        ];

        const memes = rawMemes.map(m => ({
            name: m[0],
            image: m[1],
            tags: m[2].split(','),
            highlight: m[3],
            persona: m[4],
            flaw: m[5]
        }));

        // --- 3. 隐藏彩蛋数据 ---
        const easterEggs = {
            "238796": {
                name: "专属彩蛋：Alex",
                image: "images/caidanalex.png",
                highlight: "被选召的神秘隐藏款",
                persona: "当你输入这个专属代码，所有的规则都为你让路。你有着独属于自己的精神世界，不随波逐流，是朋友圈里最特别的存在。",
                flaw: "太特别了，以至于常常让人觉得你带着一层神秘的面纱。"
            },
            "020707": {
                name: "专属彩蛋：Quinn",
                image: "images/caidanquinn.png",
                highlight: "打破次元壁的稀有掉落",
                persona: "你精准地找到了通往隐藏世界的钥匙。你聪慧、敏感且具有探险精神，平平无奇的日常无法满足你，你生来就是为了寻找彩蛋的玩家。",
                flaw: "偶尔会因为过于专注寻找细节，而忽略了身边那些触手可及的普通快乐。"
            },
            "030501": {
                name: "专属彩蛋：Yumiko",
                image: "images/caidianyumiko.png",
                highlight: "万中无一的灵魂共振",
                persona: "命中注定的相遇！你温柔且执着，带着一种让人无法拒绝的亲和力。在朋友眼中，你就像这个彩蛋一样，是平淡生活里的一抹惊喜。",
                flaw: "把太多的温柔给了别人，记得也要把同样的偏爱留给自己哦。"
            }
        };

        // --- 应用状态与逻辑 ---
        
        const app = document.getElementById('app');
        let currentStep = 0; 
        let userAnswers = []; 
        let finalResult = null; // 用于存储最终展示的结果对象

        function render() {
            app.innerHTML = '';
            if (currentStep === 0) {
                renderStart();
            } else if (currentStep > 0 && currentStep <= questions.length) {
                renderQuestion(currentStep - 1);
            } else if (currentStep === questions.length + 1) {
                renderUnlock(); 
            } else {
                renderResult();
            }
        }

        function renderStart() {
            const html = `
                <div class="fade-in flex flex-col items-center justify-center h-full pt-12 text-center">
                    <div class="w-24 h-24 mb-6 rounded-full bg-morandi-card flex items-center justify-center shadow-sm border border-morandi-border text-5xl">
                        🤡
                    </div>
                    <h2 class="text-2xl font-bold text-morandi-text mb-4 tracking-wide">测测你的本命表情包</h2>
                    <p class="text-morandi-subtext mb-10 px-4 leading-relaxed text-sm">
                        群聊潜水、周末被鸽、口头禅...<br>你伪装得再好，<br>你最常用的表情包也会出卖你的灵魂。<br>15道题，精准狙击你的当代精神状态。
                    </p>
                    <button onclick="nextStep()" class="bg-morandi-primary hover:bg-morandi-primaryDark text-morandi-text font-bold py-3.5 px-12 rounded-full shadow-sm transition-all active:scale-95">
                        开始直面灵魂
                    </button>
                    <p class="mt-6 text-xs text-morandi-subtext/70">内置50+经典发疯/佛系图库匹配</p>
                </div>
            `;
            app.innerHTML = html;
        }

        function renderQuestion(index) {
            const q = questions[index];
            let optionsHtml = '';
            q.options.forEach((opt) => {
                optionsHtml += `
                    <button onclick="selectOption('${opt.tags.join(',')}')" 
                        class="option-btn w-full text-left p-5 mb-4 rounded-2xl border-2 border-morandi-border bg-white text-morandi-text hover:border-morandi-primary/60 transition-all shadow-sm">
                        ${opt.text}
                    </button>
                `;
            });

            const html = `
                <div class="fade-in flex flex-col h-full mt-4">
                    <div class="flex justify-between items-center mb-6 text-sm text-morandi-subtext font-medium">
                        <span class="tracking-wide font-bold">Q${index + 1}</span>
                        <span>${index + 1} / ${questions.length}</span>
                    </div>
                    
                    <div class="w-full bg-morandi-border/80 h-1.5 rounded-full mb-8 overflow-hidden">
                        <div class="bg-morandi-primaryDark h-1.5 rounded-full transition-all duration-300" style="width: ${((index + 1) / questions.length) * 100}%"></div>
                    </div>

                    <h3 class="text-lg font-bold text-morandi-text mb-8 leading-snug">${q.question}</h3>
                    
                    <div class="flex-1 flex flex-col">
                        ${optionsHtml}
                        <button onclick="prevStep()" class="mt-auto mb-6 w-full bg-transparent border-2 border-morandi-border text-morandi-subtext hover:bg-white hover:text-morandi-text font-medium py-3.5 rounded-2xl transition-all active:scale-95 shadow-sm">
                            ${index === 0 ? '返回首页' : '返回上一题'}
                        </button>
                    </div>
                </div>
            `;
            app.innerHTML = html;
        }

        window.selectOption = function(tagsStr) {
            if(tagsStr) {
                userAnswers[currentStep - 1] = tagsStr.split(',');
            }
            setTimeout(() => {
                nextStep();
            }, 150); 
        }

        window.prevStep = function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        }

        function nextStep() {
            currentStep++;
            render();
        }

        function reset() {
            currentStep = 0;
            userAnswers = [];
            finalResult = null;
            render();
        }

        function calculateStandardResult() {
            let tagCounts = {};
            const allTags = userAnswers.flat().filter(Boolean);
            allTags.forEach(tag => {
                tagCounts[tag] = (tagCounts[tag] || 0) + 1;
            });

            let bestMeme = null;
            let maxScore = -1;
            
            memes.forEach(meme => {
                let score = 0;
                meme.tags.forEach(tag => {
                    if (tagCounts[tag]) score += tagCounts[tag];
                });
                
                score += Math.random() * 0.1; // 随机微调防平局

                if (score > maxScore) {
                    maxScore = score;
                    bestMeme = meme;
                }
            });

            return bestMeme || memes[0];
        }

        function renderUnlock() {
            const html = `
                <div class="fade-in flex flex-col items-center justify-center h-full pt-10 text-center">
                    <div class="w-20 h-20 mb-6 rounded-full bg-white border-4 border-morandi-border flex items-center justify-center shadow-sm text-3xl">
                        🔐
                    </div>
                    <h2 class="text-xl font-bold text-morandi-text mb-3">精神状态已提取完成</h2>
                    <p class="text-morandi-subtext mb-8 px-6 leading-relaxed text-sm">
                        请在下方输入解锁码，立即获取你的本命表情包与专属毒舌解析。
                    </p>
                    
                    <div class="w-full max-w-xs mb-6 relative">
                        <input type="text" id="unlockCode" maxlength="6" placeholder="输入6位解锁码" 
                            class="w-full text-center px-4 py-3.5 rounded-2xl border-2 border-morandi-border focus:border-morandi-primaryDark focus:outline-none bg-white text-morandi-text font-bold tracking-[0.3em] shadow-sm transition-all">
                        <p id="errorMsg" class="text-morandi-error text-xs mt-3 hidden fade-in font-bold">解锁码似乎不对哦，再试一次吧</p>
                    </div>

                    <button onclick="verifyCode()" class="w-full max-w-xs bg-morandi-primary hover:bg-morandi-primaryDark text-morandi-text font-bold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 mb-4">
                        确认解锁
                    </button>
                    <button onclick="prevStep()" class="w-full max-w-xs bg-transparent text-morandi-subtext hover:text-morandi-text text-sm py-2 transition-all">
                        返回上一题修改答案
                    </button>
                </div>
            `;
            app.innerHTML = html;
        }

        window.verifyCode = function() {
            const code = document.getElementById('unlockCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            // 全局标准密码读取 (config.js 中定义的 GLOBAL_PASSWORD)
            const standardCode = typeof GLOBAL_PASSWORD !== 'undefined' ? GLOBAL_PASSWORD : '888888';
            
            // 检查隐藏彩蛋
            if (easterEggs[code]) {
                finalResult = easterEggs[code];
                nextStep();
            } 
            // 检查标准密码
            else if (code === standardCode) {
                finalResult = calculateStandardResult();
                nextStep();
            } 
            // 密码错误
            else {
                errorMsg.classList.remove('hidden'); 
            }
        }

        function renderResult() {
            const r = finalResult;
            
            const html = `
                <div class="fade-in flex flex-col items-center pt-2 pb-6">
                    <p class="text-xs text-morandi-subtext mb-2 font-bold tracking-widest">YOUR DESTINED MEME</p>
                    <h2 class="text-2xl font-bold text-morandi-text mb-6">你的本命表情包是</h2>
                    
                    <!-- 图片展示区 -->
                    <div class="w-full max-w-[280px] bg-white p-3 rounded-3xl shadow-sm border-2 border-morandi-border mb-6">
                        <img src="${r.image}" alt="${r.name}" class="w-full h-auto rounded-2xl object-cover" onerror="this.src='https://placehold.co/400x400/FDFBF7/4A4A4A?text=表情包走丢了'">
                    </div>

                    <h3 class="text-xl font-black text-morandi-text mb-1 tracking-wider">${r.name}</h3>
                    <p class="text-xs px-3 py-1 bg-morandi-tag text-morandi-tagText rounded-full mb-8 font-bold">
                        ${r.highlight}
                    </p>

                    <!-- 文案解析区 -->
                    <div class="w-full bg-white rounded-3xl p-6 shadow-sm border-2 border-morandi-border mb-8 relative overflow-hidden">
                        
                        <div class="mb-5 relative z-10">
                            <h4 class="text-sm font-bold text-morandi-text mb-2 flex items-center">
                                <span class="mr-2">🎭</span> 朋友圈真实人设
                            </h4>
                            <p class="text-sm text-morandi-text/90 leading-relaxed bg-morandi-bg p-3 rounded-xl">
                                ${r.persona}
                            </p>
                        </div>
                        
                        <div class="relative z-10">
                            <h4 class="text-sm font-bold text-morandi-text mb-2 flex items-center">
                                <span class="mr-2">🗡️</span> 社交扎心吐槽
                            </h4>
                            <p class="text-sm text-morandi-text/90 leading-relaxed bg-morandi-bg p-3 rounded-xl">
                                ${r.flaw}
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col w-full gap-3">
                        <button onclick="alert('截图功能受浏览器限制，请直接长按屏幕或使用手机自带截图功能分享哦～')" class="w-full bg-morandi-primary hover:bg-morandi-primaryDark text-morandi-text font-bold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95">
                            截图保存，发朋友圈
                        </button>
                        <button onclick="reset()" class="w-full bg-white border-2 border-morandi-border text-morandi-subtext hover:text-morandi-text font-bold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95">
                            重新测试
                        </button>
                    </div>
                </div>
            `;
            app.innerHTML = html;
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
