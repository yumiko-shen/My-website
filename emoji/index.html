<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>测测你的本命表情包 | 你的精神状态属于哪张图？</title>
    <script src="../config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FDFBF7; color: #4A4A4A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { background-color: #FFFFFF; border: 1.5px solid #F0EBE1; color: #5C5C5C; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .option-btn:active { background-color: #F7F4ED; border-color: #DBCDBB; transform: scale(0.98); }
        .primary-btn { background-color: #E2C7B8; color: #FFFFFF; box-shadow: 0 4px 12px rgba(226,199,184,0.3); }
        .primary-btn:active { background-color: #D3B2A0; transform: scale(0.98); }
        .result-card { background: #FFFFFF; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid #F5F1E8; }
        .img-container { width: 100%; aspect-ratio: 1/1; background-color: #F9F8F4; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid #F0EBE1; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-5 pb-12">

    <!-- 首页 -->
    <div id="page-home" class="w-full max-w-md mt-16 fade-in flex flex-col items-center text-center">
        <span class="text-xs font-bold tracking-widest text-[#B5A49D] mb-4 uppercase">YOUR DESTINED MEME</span>
        <h1 class="text-3xl font-extrabold text-[#4A4A4A] mb-4 leading-snug">测测你的本命表情包</h1>
        <p class="text-[15px] text-[#7A7A7A] mb-12 leading-relaxed px-4">
            在当代年轻人的社交里，<br>表情包就是我们褪下伪装后的真实精神状态。<br>15道题，测出属于你的那一张“灵魂截图”。
        </p>
        <button onclick="startTest()" class="primary-btn w-full py-4 rounded-xl font-bold text-lg tracking-wide">
            开始测试
        </button>
    </div>

    <!-- 答题页 -->
    <div id="page-quiz" class="w-full max-w-md mt-8 hidden flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <span id="q-progress" class="text-sm font-semibold text-[#B5A49D]">1 / 15</span>
            <div class="h-1.5 w-2/3 bg-[#F0EBE1] rounded-full overflow-hidden">
                <div id="q-bar" class="h-full bg-[#E2C7B8] transition-all duration-300 w-[6.6%]"></div>
            </div>
        </div>
        <h2 id="q-title" class="text-xl font-bold mb-8 leading-relaxed text-[#4A4A4A]"></h2>
        <div id="q-options" class="flex flex-col gap-4 mb-8"></div>
        <button id="btn-prev" onclick="prevQuestion()" class="mt-auto py-3 text-[#A39B98] text-sm font-medium hidden">
            ← 返回上一题
        </button>
    </div>

    <!-- 解锁页 -->
    <div id="page-unlock" class="w-full max-w-md mt-16 hidden flex-col items-center text-center fade-in">
        <div class="w-16 h-16 bg-[#F7F4ED] rounded-full flex items-center justify-center mb-6">
            <span class="text-2xl">🔒</span>
        </div>
        <h2 class="text-2xl font-bold mb-3 text-[#4A4A4A]">结果已生成</h2>
        <p class="text-sm text-[#7A7A7A] mb-8 px-4">你的本命表情包和精神状态分析已准备就绪，请输入解锁码查看。</p>
        <input type="text" id="unlock-code" placeholder="输入6位解锁码" class="w-full text-center py-4 rounded-xl border-2 border-[#F0EBE1] bg-white focus:outline-none focus:border-[#E2C7B8] text-lg font-bold mb-4 tracking-widest transition-colors">
        <p id="error-msg" class="text-[#D37676] text-sm mb-4 hidden">密码不正确，请重新输入</p>
        <button onclick="verifyCode()" class="primary-btn w-full py-4 rounded-xl font-bold text-lg mb-4">
            确认解锁
        </button>
        <button onclick="prevQuestion()" class="py-3 text-[#A39B98] text-sm font-medium w-full">
            ← 返回修改最后一题
        </button>
    </div>

    <!-- 结果页 -->
    <div id="page-result" class="w-full max-w-md hidden flex flex-col items-center fade-in pb-10 mt-6">
        <span class="text-xs font-bold tracking-widest text-[#B5A49D] mb-4 uppercase">YOUR DESTINED MEME</span>
        <h1 class="text-2xl font-extrabold text-[#4A4A4A] mb-6">你的本命表情包是</h1>
        
        <div class="img-container">
            <img id="res-img" src="" alt="表情包结果">
        </div>

        <h2 id="res-name" class="text-2xl font-bold mb-3 text-[#4A4A4A]"></h2>
        <span id="res-tag" class="px-4 py-1.5 bg-[#F4EFEA] text-[#8C7A70] rounded-full text-sm font-medium mb-8"></span>

        <div class="result-card w-full p-6 mb-8 text-left">

        <button onclick="location.reload()" class="w-full py-4 rounded-xl font-bold text-lg bg-[#FFFFFF] border-2 border-[#E2C7B8] text-[#D3B2A0] active:bg-[#FDFBF7] transition-all">

        ];

        // 15个标准结果
        const results = [
            { name: "水豚卡皮巴拉", tag: "情绪稳定天花板", img: "images/1.png", desc1: "极度佛系，看破红尘。无论遇到多大的事情，你都能保持一种死猪不怕开水烫的松弛感。朋友眼中的情绪稳定剂。", desc2: "不是脾气好，只是懒得生气。小心长期压抑变成间歇性火山爆发哦。" },
            { name: "打工苦命吗喽", tag: "失去灵魂的躯壳", img: "images/2.png", desc1: "表面上是个遵纪守法的好青年，背地里每天都在倒数下班。在朋友聚会中通常是那个负责倒苦水的打工人。", desc2: "一边喊着要辞职，一边把活干得比谁都好。典型的嘴硬心软老好人。" },
            { name: "流汗黄豆", tag: "阴阳怪气大师", img: "images/3.png", desc1: "在这个世界上，没有什么是你一个流汗黄豆解决不了的。如果有，那就发两个。你擅长用最克制的表情表达最强烈的无语。", desc2: "有什么不满都不直说，非要让别人去猜你的弦外之音。沟通成本极高！" },
            { name: "尖叫扭曲的猫", tag: "随时随地大小疯", img: "images/4.png", desc1: "你的精神状态就像个高压锅，随时处于崩溃边缘。开心了狂舞，难过了爆哭，情绪表达极其外放，绝不内耗自己。", desc2: "朋友们很怕你突然在街上做出什么奇怪的举动，和你在一起需要极强的心脏承受力。" },
            { name: "敲木鱼", tag: "赛博修仙人", img: "images/5.png", desc1: "阿弥陀佛，善哉善哉。你已经彻底放弃了世俗的挣扎，遇到倒霉事第一反应是给自己积功德。朋友们觉得你随时都要出家。", desc2: "强装看破红尘，其实心里急得要死。不要用战术上的佛系掩盖战略上的懒惰。" },
            { name: "微笑着活下去", tag: "强颜欢笑冠军", img: "images/6.png", desc1: "生活给了你一巴掌，你还要对它说声谢谢。你是那种就算天塌下来也会微笑着说“没关系”的人，温柔得让人心疼。", desc2: "太在意别人的感受，往往委屈了自己。偶尔也试着自私一点吧！" },
            { name: "熊猫头", tag: "万恶之源沙雕王", img: "images/7.png", desc1: "脑洞极大，造梗机器。哪里有你，哪里就充满了快活的空气。你是朋友圈里的开心果，斗图从未输过。", desc2: "总是在用幽默掩饰真心。有时候别人很难分辨你到底是在开玩笑还是认真的。" },
            { name: "流泪狗头", tag: "又惨又好笑", img: "images/8.png", desc1: "自带一种清澈的愚蠢。生活中总是会遇到各种倒霉的小插曲，但你总能用自嘲的方式化解，让人又心疼又想笑。", desc2: "少一点自我感动，多一点行动力。别总是把“我太难了”挂在嘴边。" },
            { name: "葛优瘫", tag: "反卷先锋", img: "images/9.png", desc1: "能坐着绝不站着，能躺着绝不坐着。你的最高生活理想就是当一个快乐的废物，散发着一种令人向往的颓废美学。", desc2: "严重拖延症患者。很多事情不到最后一刻绝对提不起劲来做。" },
            { name: "柴犬Doge", tag: "看破不说破", img: "images/10.png", desc1: "拥有看透一切的锐利目光。你很聪明，很多事情你都心知肚明，但就是静静地看着别人装，享受一种众人皆醉我独醒的快感。", desc2: "有时显得过于冷漠和置身事外。小心变成别人眼里的“乐子人”。" },
            { name: "捂脸哭", tag: "无效沟通受害者", img: "images/11.png", desc1: "你是一个共情能力很强的人。在社交中常常因为别人的奇葩行为感到无奈，你的日常充满了一种“这世界终于疯了”的疲惫感。", desc2: "太容易受到外界环境的影响，情绪容易被别人牵着鼻子走。" },
            { name: "抱抱", tag: "治愈系小天使", img: "images/12.png", desc1: "温柔是你最大的武器。朋友难过时第一个想倾诉的对象就是你，你总能提供满满的情绪价值，是个超级小暖炉。", desc2: "别人的垃圾桶当久了，自己的负能量却无处释放。要学会拒绝哦！" },
            { name: "黑人问号", tag: "清澈的迷茫", img: "images/13.png", desc1: "你的世界里充满了“啊？”“啥？”“什么鬼？”。你思考回路比较长，常常跟不上大家的节奏，自带一种呆萌属性。", desc2: "少发点呆，多读点书。有时候真的不是别人表达不清楚，而是你没带脑子出门。" },
            { name: "猫猫祟祟", tag: "社恐观察员", img: "images/14.png", desc1: "在陌生环境里你就像隐形人。极度缺乏安全感，总是躲在暗处默默观察，确认绝对安全后才会慢慢展现真实的自己。", desc2: "防御心太重啦。试着大胆迈出第一步，你会发现大家其实都很友好。" },
            { name: "疯狂锤墙", tag: "暴躁老哥/老姐", img: "images/15.png", desc1: "嫉恶如仇，性子极直。遇到不公平的事情绝对忍不了一点，路见不平一声吼，是朋友们最坚实的后盾。", desc2: "情绪上头快，下头也快。经常因为冲动说错话、做错事，事后又追悔莫及。" }
        ];

        // 3个隐藏专属彩蛋结果
        const easterEggs = {
            "238796": {
                name: "专属彩蛋：Alex",
                tag: "稳中带皮 人间清醒",
                img: "images/caidanalex.png",
                desc1: "你的灵魂主打一个“看似稳中带皮，实则人间清醒”。在朋友圈里你是靠谱的代名词，但偶尔也会闪烁着让人猝不及防的黑色幽默，极具个人魅力。",
                desc2: "表面上是个极其理性的人，其实内心戏比谁都丰富。记得偶尔把紧绷的神经放松下来，不要总是一个人扛下所有情绪哦。"
            },
            "020707": {
                name: "专属彩蛋：Quinn",
                tag: "快乐源泉 奇妙脑洞",
                img: "images/caidanquinn.png",
                desc1: "捕捉到一只拥有奇妙脑洞的 Quinn！你的精神状态在“极度沙雕”和“文艺青年”之间反复横跳，是朋友们眼里的快乐源泉和不一样的烟火。",
                desc2: "总是把最阳光的一面给别人，自己的emo却只能在深夜默默消化。该发疯时就发疯，别老做委屈自己的老好人！"
            },
            "030501": {
                name: "专属彩蛋：Yumiko",
                tag: "万中无一的灵魂共振",
                img: "images/caidanyumiko.png",
                desc1: "命中注定的相遇！你温柔且执着，带着一种让人无法拒绝的亲和力。在朋友眼中，你就像这个彩蛋一样，是平淡生活里的一抹惊喜和无可替代的白月光。",
                desc2: "把太多的温柔给了别人，偶尔也会因为别人无心的举动而暗自内耗。记得也要把同样的偏爱留给自己哦！"
            }
        };

        let currentQuestion = 0;
        let score = 0;

        function startTest() {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-progress').innerText = `${currentQuestion + 1} / 15`;
            document.getElementById('q-bar').style.width = `${((currentQuestion + 1) / 15) * 100}%`;
            document.getElementById('q-title').innerText = q.q;
            
            const optionsHtml = q.options.map((opt, index) => 
                `<button onclick="selectOption(${index})" class="option-btn w-full text-left p-4 rounded-xl text-[15px] leading-relaxed">${opt}</button>`
            ).join('');
            
            document.getElementById('q-options').innerHTML = optionsHtml;
            
            if (currentQuestion > 0) {
                document.getElementById('btn-prev').classList.remove('hidden');
            } else {
                document.getElementById('btn-prev').classList.add('hidden');
            }
        }

        function selectOption(index) {
            score += index;
            if (currentQuestion < 14) {
                currentQuestion++;
                renderQuestion();
            } else {
                document.getElementById('page-quiz').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('hidden');
                document.getElementById('page-unlock').classList.add('flex');
            }
        }

        function prevQuestion() {
            if(document.getElementById('page-unlock').classList.contains('flex')) {
                document.getElementById('page-unlock').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('flex');
                document.getElementById('page-quiz').classList.remove('hidden');
                return;
            }
            if (currentQuestion > 0) {
                currentQuestion--;
                score -= 1; // 简单粗暴减去预估分数，实际不影响娱乐测试
                renderQuestion();
            }
        }

        function verifyCode() {
            const code = document.getElementById('unlock-code').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            // 1. 优先检查是否命中彩蛋密码
            if (easterEggs[code]) {
                showEasterEggResult(easterEggs[code]);
                return;
            }

            // 2. 检查全局普通密码
            const correctCode = typeof GLOBAL_PASSWORD !== 'undefined' ? GLOBAL_PASSWORD : '888888';
            if (code === correctCode) {
                showStandardResult();
            } else {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 2000);
            }
        }

        // 显示普通测试结果
        function showStandardResult() {
            document.getElementById('page-unlock').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('flex');
            document.getElementById('page-result').classList.remove('hidden');
            
            const index = score % 15; // 使用取模保证结果在0-14之间
            const res = results[index];
            
            document.getElementById('res-img').src = res.img;
            document.getElementById('res-name').innerText = res.name;
            document.getElementById('res-tag').innerText = res.tag;
            document.getElementById('res-desc1').innerText = res.desc1;
            document.getElementById('res-desc2').innerText = res.desc2;
        }

        // 显示彩蛋结果
        function showEasterEggResult(eggData) {
            document.getElementById('page-unlock').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('flex');
            document.getElementById('page-result').classList.remove('hidden');
            
            document.getElementById('res-img').src = eggData.img;
            document.getElementById('res-name').innerText = eggData.name;
            document.getElementById('res-tag').innerText = eggData.tag;
            document.getElementById('res-desc1').innerText = eggData.desc1;
            document.getElementById('res-desc2').innerText = eggData.desc2;
        }
    </script>
</body>
</html>
