        <button id="btn-prev" onclick="prevQuestion()" class="mt-auto py-3 text-[#A39B98] text-sm font-medium hidden">

        </button>
    </div>

        let currentQuestion = 0;
        let score = 0;

        function startTest() {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-progress').innerText = `${currentQuestion + 1} / 15`;
            document.getElementById('q-bar').style.width = `${((currentQuestion + 1) / 15) * 100}%`;
            document.getElementById('q-title').innerText = q.q;
            
            const optionsHtml = q.options.map((opt, index) => 
                `<button onclick="selectOption(${index})" class="option-btn w-full text-left p-4 rounded-xl text-[15px] leading-relaxed">${opt}</button>`
            ).join('');
            
            document.getElementById('q-options').innerHTML = optionsHtml;
            
            if (currentQuestion > 0) {
                document.getElementById('btn-prev').classList.remove('hidden');
            } else {
                document.getElementById('btn-prev').classList.add('hidden');
            }
        }

        function selectOption(index) {
            score += index;
            if (currentQuestion < 14) {
                currentQuestion++;
                renderQuestion();
            } else {
                document.getElementById('page-quiz').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('hidden');
                document.getElementById('page-unlock').classList.add('flex');
            }
        }

                document.getElementById('page-unlock').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('flex');
                document.getElementById('page-quiz').classList.remove('hidden');
                return;
            }
            if (currentQuestion > 0) {
                currentQuestion--;
                score -= 1; // 简单粗暴减去预估分数，实际不影响娱乐测试
                renderQuestion();
            }
        }

        function verifyCode() {
            const code = document.getElementById('unlock-code').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            // 1. 优先检查是否命中彩蛋密码
            if (easterEggs[code]) {
                showEasterEggResult(easterEggs[code]);
                return;
            }

            // 2. 检查全局普通密码
            const correctCode = typeof GLOBAL_PASSWORD !== 'undefined' ? GLOBAL_PASSWORD : '888888';
            if (code === correctCode) {
                showStandardResult();
            } else {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 2000);
            }
        }

        // 显示普通测试结果
        function showStandardResult() {
            document.getElementById('page-unlock').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('flex');
            document.getElementById('page-result').classList.remove('hidden');
            
            const index = score % 15; // 使用取模保证结果在0-14之间
            const res = results[index];
            
            document.getElementById('res-img').src = res.img;
            document.getElementById('res-name').innerText = res.name;
            document.getElementById('res-tag').innerText = res.tag;
            document.getElementById('res-desc1').innerText = res.desc1;
            document.getElementById('res-desc2').innerText = res.desc2;
        }

        // 显示彩蛋结果
        function showEasterEggResult(eggData) {
            document.getElementById('page-unlock').classList.add('hidden');
            document.getElementById('page-unlock').classList.remove('flex');
            document.getElementById('page-result').classList.remove('hidden');
            
            document.getElementById('res-img').src = eggData.img;
            document.getElementById('res-name').innerText = eggData.name;
            document.getElementById('res-tag').innerText = eggData.tag;
            document.getElementById('res-desc1').innerText = eggData.desc1;
            document.getElementById('res-desc2').innerText = eggData.desc2;
        }
    </script>
</body>
</html>
