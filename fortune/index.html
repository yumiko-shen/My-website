    <style>
        /* 星空塔罗高级风配色体系 */
        :root {
            --starry-blue: #0F1423; /* 星空夜蓝 */
            --card-bg: #1C2333;     /* 塔罗牌卡片底色 */
            --champagne: #DBC18B;   /* 香槟金 */
            --pearl: #F4F4F6;       /* 珍珠白 */
            --dark-gold: #B89C63;
        }
        body {
            background-color: var(--starry-blue);
            color: var(--pearl);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(219, 193, 139, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(219, 193, 139, 0.05), transparent 25%);
        }
        
        /* 平滑动画 */
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .fade-out { animation: fadeOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }
        
        /* 按钮与卡片样式 */
        .option-btn {
            background-color: var(--card-bg);
            border: 1px solid rgba(219, 193, 139, 0.25);
            color: var(--pearl);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .option-btn:active, .option-btn:hover {
            background-color: rgba(219, 193, 139, 0.15);
            border-color: var(--champagne);
            transform: scale(0.98);
            box-shadow: 0 0 15px rgba(219, 193, 139, 0.2);
        }
        
        .primary-btn {
            background: linear-gradient(135deg, var(--dark-gold) 0%, var(--champagne) 100%);
            color: var(--starry-blue);
            box-shadow: 0 4px 20px rgba(219, 193, 139, 0.3);
            transition: all 0.2s;
        }
        .primary-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(219, 193, 139, 0.15);
        }
        
        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(219, 193, 139, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        /* 卡片光泽效果 */
        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }
        @keyframes shine { 0% {left: -100%;} 20% {left: 200%;} 100% {left: 200%;} }

        .progress-bar-fill { background: linear-gradient(90deg, var(--dark-gold), var(--champagne)); }
        .tag-pill {
            background-color: rgba(219, 193, 139, 0.1);
            border: 1px solid rgba(219, 193, 139, 0.4);
            color: var(--champagne);
        }
        .content-box {
            background-color: rgba(15, 20, 35, 0.6);
            border-left: 3px solid var(--champagne);
        }
        
        .gold-text {
            background: linear-gradient(to right, #DBC18B, #F9F2D8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .glow-border {
            border: 2px solid rgba(219, 193, 139, 0.4);
            box-shadow: 0 0 25px rgba(219, 193, 139, 0.15);
        }
    </style>

        let currentQuestion = 0;
        let score = 0;

        function startTest() {
            const home = document.getElementById('page-home');
            home.classList.remove('fade-in');
            home.classList.add('fade-out');
            
            setTimeout(() => {
                home.classList.add('hidden');
                const quiz = document.getElementById('page-quiz');
                quiz.classList.remove('hidden');
                quiz.classList.remove('fade-out');
                quiz.classList.add('fade-in');
                renderQuestion();
            }, 350);
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('q-progress').innerText = `${currentQuestion + 1} / 15`;
            document.getElementById('q-bar').style.width = `${((currentQuestion + 1) / 15) * 100}%`;
            document.getElementById('q-title').innerText = q.q;
            
            const optionsHtml = q.options.map((opt, index) => 
                `<button onclick="selectOption(${index})" class="option-btn w-full text-left px-5 py-4 rounded-2xl text-[15px] leading-relaxed mb-4">${opt}</button>`
            ).join('');
            
            document.getElementById('q-options').innerHTML = optionsHtml;
            
            if (currentQuestion > 0) {
                document.getElementById('btn-prev').classList.remove('hidden');
            } else {
                document.getElementById('btn-prev').classList.add('hidden');
            }
        }

        function selectOption(index) {
            // Hash scoring logic
            score += index * (currentQuestion + 1) * 7 + 11;
            
            if (currentQuestion < 14) {
                currentQuestion++;
                
                const quizDiv = document.getElementById('page-quiz');
                quizDiv.classList.remove('fade-in');
                quizDiv.style.opacity = '0';
                
                setTimeout(() => {
                    renderQuestion();
                    quizDiv.classList.add('fade-in');
                    quizDiv.style.opacity = '1';
                }, 250);
            } else {
                showUnlockPage();
            }
        }

        function prevQuestion() {
            if(document.getElementById('page-unlock').classList.contains('flex')) {
                document.getElementById('page-unlock').classList.add('hidden');
                document.getElementById('page-unlock').classList.remove('flex');
                
                const quiz = document.getElementById('page-quiz');
                quiz.classList.remove('hidden');
                quiz.classList.remove('fade-out');
                quiz.classList.add('fade-in');
                return;
            }
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showUnlockPage() {
            const quiz = document.getElementById('page-quiz');
            quiz.classList.remove('fade-in');
            quiz.classList.add('fade-out');
            
            setTimeout(() => {
                quiz.classList.add('hidden');
                const unlock = document.getElementById('page-unlock');
                unlock.classList.remove('hidden');
                unlock.classList.remove('fade-out');
                unlock.classList.add('flex', 'fade-in');
            }, 350);
        }

        function verifyCode() {
            const code = document.getElementById('unlock-code').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const inputField = document.getElementById('unlock-code');
            
            const correctCode = typeof window.GLOBAL_PASSWORD !== 'undefined' ? window.GLOBAL_PASSWORD : '888888';
            
            if (code === correctCode) {
                showStandardResult();
            } else {
                errorMsg.classList.remove('hidden');
                inputField.style.borderColor = '#FF8A8A';
                setTimeout(() => {
                    errorMsg.classList.add('hidden');
                    inputField.style.borderColor = 'rgba(219, 193, 139, 0.4)';
                }, 2000);
            }
        }

        function showStandardResult() {
            const unlock = document.getElementById('page-unlock');
            unlock.classList.remove('fade-in');
            unlock.classList.add('fade-out');
            
            setTimeout(() => {
                unlock.classList.add('hidden');
                unlock.classList.remove('flex');
                
                const result = document.getElementById('page-result');
                result.classList.remove('hidden');
                result.classList.add('fade-in');
                
                const index = score % results.length; 
                const res = results[index];
                
                document.getElementById('res-name').innerText = res.name;
                document.getElementById('res-tag').innerText = res.tag;
                document.getElementById('res-main').innerText = res.main;
                document.getElementById('res-highlight').innerText = res.highlight;
                document.getElementById('res-advice').innerText = res.advice;
            }, 350);
        }
    </script>
